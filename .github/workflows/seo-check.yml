name: SEO and site checks

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: seo-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: |
          node --check assets/js/main.js
          node --check assets/js/site-language.js
          node --check assets/js/inquiry-conversion.js
          node --check api/inquiry.js
          node --check scripts/check-seo.mjs
          node --check scripts/check-live-site.mjs
          node --check scripts/check-inquiry-attribution.mjs
          node --check scripts/submit-indexnow.mjs
          node --check scripts/apply-inquiry-layer.mjs
          node --check scripts/enforce-accessible-colors.mjs
          node --check data/insight-source.mjs
          node --check data/site-locales.mjs
          node --check data/localized-topics.mjs
          node --check data/localized-products.mjs
          node --check scripts/generate-insight-pages.mjs
          node --check scripts/generate-localized-site.mjs
          node --check scripts/check-localized-site.mjs

      - name: Confirm generated site content is current
        run: |
          node scripts/generate-insight-pages.mjs
          node scripts/generate-localized-site.mjs

      - name: Run SEO and content audits
        run: |
          node scripts/check-seo.mjs
          node scripts/apply-language-switcher.mjs --check
          node scripts/check-localized-site.mjs
          node scripts/audit-content.mjs
          node scripts/apply-inquiry-layer.mjs --check
          node scripts/check-inquiry-attribution.mjs
          node scripts/enforce-accessible-colors.mjs --check

      - name: Confirm generated files and image markup are current
        run: |
          node scripts/optimize-image-tags.mjs
          git diff --exit-code
